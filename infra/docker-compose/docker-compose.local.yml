services:
  api:
    build:
      context: ../../backend
    container_name: retailflow-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: local-dev-only-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      POSTGRES_DB: retailflow
      POSTGRES_USER: retailflow
      POSTGRES_PASSWORD: retailflow
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_DIRECT_TOPIC: retailflow.direct.order_signals
    working_dir: /app
    command:
      - sh
      - -c
      - python manage.py migrate && gunicorn retailflow.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"

  celery-worker:
    build:
      context: ../../backend
    container_name: retailflow-celery-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: local-dev-only-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      POSTGRES_DB: retailflow
      POSTGRES_USER: retailflow
      POSTGRES_PASSWORD: retailflow
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_DIRECT_TOPIC: retailflow.direct.order_signals
    working_dir: /app
    command:
      - celery
      - -A
      - retailflow
      - worker
      - -l
      - info

  postgres:
    image: postgres:16
    container_name: retailflow-postgres
    environment:
      POSTGRES_DB: retailflow
      POSTGRES_USER: retailflow
      POSTGRES_PASSWORD: retailflow
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "5433:5432"
    volumes:
      - retailflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailflow -d retailflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: retailflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: retailflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: retailflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-connect:
    image: debezium/connect:2.7.0.Final
    container_name: retailflow-kafka-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: retailflow-connect
      CONFIG_STORAGE_TOPIC: retailflow_connect_configs
      OFFSET_STORAGE_TOPIC: retailflow_connect_offsets
      STATUS_STORAGE_TOPIC: retailflow_connect_status

  kafka-consumer:
    build:
      context: ../../workers/kafka_consumer
    container_name: retailflow-kafka-consumer
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_TOPICS: retailflow.public.orders_order,retailflow.direct.order_signals,retailflow.direct.order_signals.partitioned

volumes:
  retailflow-postgres-data:
