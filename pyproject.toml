[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "retailflow.settings"
pythonpath = ["backend"]
testpaths = ["backend"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*", "*Tests"]
