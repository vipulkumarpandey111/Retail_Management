name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform/envs/dev init -backend=false
      - run: terraform -chdir=infra/terraform/envs/dev validate

